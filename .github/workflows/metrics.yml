name: Metrics

on:
  # atualiza sozinho a cada 6 horas
  schedule:
    - cron: "0 */6 * * *"
  # atualiza a cada push no repositório do perfil
  push:
    branches: [main]
  # permite rodar na mão pela aba Actions
  workflow_dispatch:

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Matheussil01
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: America/Sao_Paulo
          filename: github-metrics.svg
          # linguagens mais usadas
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_limit: 6
          # inclui commits de repositórios privados nas contagens
          commits_authoring: Matheussil01
